group 'com.shounakmulay.telephony'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.6.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Upgraded to AGP 8.2.1 for AGP 8+ compatibility.
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Application dependencies belong in the individual module build.gradle files.
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Update compileSdkVersion to 33 (or higher if needed)
    compileSdkVersion 33

    // IMPORTANT: Declare the namespace explicitly for AGP 8+
    namespace "com.shounakmulay.telephony"

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Set your minimum SDK version as required.
        minSdkVersion 23
        // You can also specify targetSdkVersion if needed.
        targetSdkVersion 33
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.annotation:annotation:1.3.0'
}
